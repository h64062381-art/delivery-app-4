<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب - وصّلني</title><style>body{margin:0;background:#fff9ef;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:700px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#8d4f32,#b96f4c);color:#fff;border-radius:24px;padding:22px}.card{background:#fff;border:1px solid #ead8c4;border-radius:20px;padding:18px;margin-top:14px}.timeline{display:grid;gap:10px}.s{padding:13px;border-radius:14px;background:#f4eadf;color:#7d7067}.s.on{background:#8d4f32;color:#fff;font-weight:900}.muted{color:#7d7067}.btn{display:inline-block;background:#8d4f32;color:#fff;padding:12px 16px;border-radius:13px;text-decoration:none;font-weight:900}</style></head><body><main class="app"><a href="orders.html" class="btn">→ طلباتي</a><div id="box"></div></main><script src="wasselni-db.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||localStorage.getItem('wasselniCurrentOrderId');const rank={pending:0,accepted:1,preparing:2,ready:3,picked_up:4,delivered:5};const labels=[['pending','📨 تم إرسال الطلب','وصل الطلب للمطعم'],['accepted','👍 تم قبول الطلب','المطعم وافق على طلبك'],['preparing','👨‍🍳 قيد التحضير','المطعم يجهز طلبك الآن'],['ready','🛵 جاهز للسائق','الطلب صار جاهز ويظهر للسائق'],['picked_up','🚴 السائق استلم الطلب','السائق متوجه إليك'],['delivered','✅ تم التوصيل','تم تسليم الطلب بنجاح']];
function draw(){const o=id?WasselniOrders.get(id):WasselniOrders.latest();if(!o){box.innerHTML='<div class="card"><h2>ماكو طلب حالياً</h2><a class="btn" href="restaurants.html">اطلب هسه</a></div>';return}const r=rank[o.status]??0;box.innerHTML='<section class="hero"><small>رقم الطلب</small><h1>#'+o.id+'</h1><p>'+((labels.find(x=>x[0]===o.status)||labels[0])[1])+'</p></section><section class="card"><div class="timeline">'+labels.map((x,i)=>'<div class="s '+(i<=r?'on':'')+'"><b>'+x[1]+'</b><br><small>'+x[2]+'</small></div>').join('')+'</div></section><section class="card"><b>التوصيل إلى</b><p>'+o.address+'</p><b>الإجمالي</b><p>'+Number(o.total||0).toLocaleString('en-US')+' د.ع</p>'+((o.status==='picked_up')?'<div style="margin-top:12px;padding:12px;border-radius:14px;background:#f1dfc7;color:#8d4f32;font-weight:900">🚴 '+(o.driverName||'السائق')+' استلم الطلب وهو بالطريق إليك</div>':'')+((o.status==='delivered')?'<div style="margin-top:12px;padding:12px;border-radius:14px;background:#e8efe9;color:#54715b;font-weight:900">✅ تم تسليم الطلب</div>':'')+'</section>'}draw();WasselniOrders.subscribe(draw);
</script></body></html>
