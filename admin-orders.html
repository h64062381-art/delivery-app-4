<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الطلبات - وصّلني</title><style>:root{--p:#8d4f32;--bg:#fff9ef;--sand:#f1dfc7;--ink:#29231f;--muted:#7d7067;--line:#ead8c4;--g:#54715b;--r:#a54b42}*{box-sizing:border-box}body{margin:0;background:#eee5dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:1200px;margin:auto;min-height:100vh;background:var(--bg)}header{padding:20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;color:var(--p)}.mark{display:inline-grid;place-items:center;background:var(--p);color:#fff;border-radius:12px;width:40px;height:40px;margin-left:8px}.content{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat b{display:block;font-size:25px;margin-top:7px;color:var(--p)}.muted{color:var(--muted);font-size:13px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 10px;border-bottom:1px solid #f0e4d7;text-align:right}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:var(--sand);color:var(--p);font-size:12px;font-weight:800}.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.btn.green{background:var(--g)}.btn.red{background:var(--r)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><header><div class="logo"><span class="mark">و</span>وصّلني <small>/ الإدارة</small></div><button class="btn" onclick="load()">تحديث</button></header><section class="content"><div class="stats" id="stats"></div><div class="card"><h2>كل الطلبات</h2><p class="muted">متابعة الطلب من لحظة وصوله إلى المطعم إلى التسليم.</p><div class="tablewrap"><table class="table"><thead><tr><th>الطلب</th><th>الزبون</th><th>المطعم</th><th>القيمة</th><th>الحالة</th><th>المندوب</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script src="wasselni-db.js"></script><script>
const labels={new:'جديد',accepted:'مقبول',preparing:'قيد التحضير',ready:'جاهز',picked_up:'تم الاستلام',on_the_way:'بالطريق',delivered:'تم التسليم',cancelled:'ملغي'};async function load(){const a=await WASSELNI_DB.list();const count=s=>a.filter(o=>o.status===s).length;stats.innerHTML=[['كل الطلبات',a.length],['قيد التحضير',count('preparing')],['جاهزة للمندوب',count('ready')],['تم التسليم',count('delivered')]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');rows.innerHTML=a.map(o=>`<tr><td><b>#${o.id}</b></td><td>${o.customer_name||o.name||''}<br><span class="muted">${o.phone||''}</span></td><td>${o.restaurant_name||'—'}</td><td>${Number(o.total||0).toLocaleString('ar-IQ')} د.ع</td><td><span class="badge">${labels[o.status]||o.status}</span></td><td>${o.driver_name||'غير معيّن'}</td><td>${o.status==='new'?`<button class="btn" onclick="setS('${o.id}','accepted')">قبول</button>`:o.status==='accepted'?`<button class="btn" onclick="setS('${o.id}','preparing')">بدء التحضير</button>`:o.status==='preparing'?`<button class="btn green" onclick="setS('${o.id}','ready')">جاهز</button>`:o.status==='delivered'?'<span class="muted">مكتمل</span>':'<span class="muted">متابعة</span>'}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد طلبات.</td></tr>'}async function setS(id,status){await WASSELNI_DB.update(id,{status});load()}load();</script></body></html>
