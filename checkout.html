<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد الطلب - وصّلني</title><link rel="stylesheet" href="wasselni.css"><style>body{margin:0;background:#fff9ef;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:700px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #ead8c4;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(86,48,30,.08)}h1{margin:0 0 8px;color:#8d4f32}.muted{color:#7d7067}.form{display:grid;gap:12px}.field{border:1px solid #ead8c4;border-radius:14px;padding:13px;width:100%;box-sizing:border-box}.btn{border:0;background:#8d4f32;color:#fff;padding:14px 16px;border-radius:14px;font-weight:900;width:100%;cursor:pointer}.summary{margin:15px 0;padding:14px;background:#fff9ef;border-radius:16px}.success{display:none;text-align:center}.success.show{display:block}.check{font-size:55px}.steps{display:grid;gap:9px;margin-top:18px}.step{padding:12px;border-radius:13px;background:#f5eadc}.step.active{background:#8d4f32;color:#fff;font-weight:900}</style></head><body><main class="app"><div class="card" id="formBox"><h1>تأكيد الطلب</h1><p class="muted">أدخل بيانات التوصيل وبعدها نرسل الطلب مباشرة للمطعم.</p><form class="form" onsubmit="placeOrder(event)"><input id="name" class="field" placeholder="الاسم" required><input id="phone" class="field" placeholder="رقم الهاتف" inputmode="tel" required><input id="address" class="field" placeholder="العنوان" required><select id="pay" class="field"><option>الدفع عند الاستلام</option><option>دفع إلكتروني</option></select><textarea id="note" class="field" placeholder="ملاحظة للطلب"></textarea><div class="summary"><b>الإجمالي</b><div id="total">0 د.ع</div></div><button class="btn">تأكيد الطلب وإرساله للمطعم</button></form></div><div class="card success" id="success"><div class="check">✅</div><h1>تم إرسال الطلب</h1><p class="muted">طلبك وصل للمطعم، وتكدر تتابع حالته من هنا.</p><div id="orderInfo"></div><a class="btn" style="display:block;text-decoration:none;margin-top:15px" href="order-tracking.html" id="trackLink">متابعة الطلب</a></div></main><script src="wasselni-db.js"></script><script>
const cart=JSON.parse(localStorage.getItem('wasselniCart')||localStorage.getItem('wasselni_cart')||'[]');
const total=cart.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||1),0)+1500;document.getElementById('total').textContent=total.toLocaleString('en-US')+' د.ع';
function placeOrder(e){e.preventDefault();if(!cart.length){alert('السلة فارغة');location.href='restaurants.html';return}const o=WasselniOrders.create({customer:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),payment:document.getElementById('pay').value,note:document.getElementById('note').value.trim(),items:cart,total,restaurantStatus:'pending',status:'pending',driverStatus:'waiting'});localStorage.setItem('wasselniCurrentOrderId',o.id);localStorage.removeItem('wasselniCart');localStorage.removeItem('wasselni_cart');document.getElementById('formBox').style.display='none';document.getElementById('success').classList.add('show');document.getElementById('trackLink').href='order-tracking.html?id='+encodeURIComponent(o.id);document.getElementById('orderInfo').innerHTML='<b>رقم الطلب #'+o.id+'</b><div class="steps"><div class="step active">📨 تم إرسال الطلب للمطعم</div><div class="step">👍 بانتظار موافقة المطعم</div><div class="step">👨‍🍳 قيد التحضير</div><div class="step">🛵 جاهز للسائق</div></div>';}
</script></body></html>
