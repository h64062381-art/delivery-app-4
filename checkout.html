<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع - وصّلني</title><style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;direction:rtl}button,a{font:inherit}a{text-decoration:none;color:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:18px 18px 10px;position:sticky;top:0;z-index:20;background:rgba(255,249,239,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(234,216,196,.7)}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;color:var(--primary)}.logo-mark{width:42px;height:42px;border-radius:14px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}.icon-btn{border:0;background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:14px;cursor:pointer}.hero{margin:18px;background:linear-gradient(135deg,var(--primary),var(--primary2));border-radius:28px;padding:24px;color:#fff;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:29px}.hero p{margin:0 0 18px;opacity:.9;line-height:1.7}.search{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 15px;width:100%;outline:none;color:var(--ink)}.section{padding:4px 18px 18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.section h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px}.chips{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.chip{min-width:88px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px 12px;text-align:center;cursor:pointer}.chip b{display:block;margin-top:6px;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 7px 22px rgba(86,48,30,.06)}.card-body{padding:13px}.thumb{height:120px;background:linear-gradient(135deg,var(--sand),#fff);display:grid;place-items:center;font-size:46px}.card h3{margin:0 0 5px;font-size:15px}.price{color:var(--primary);font-weight:900}.small{font-size:12px;color:var(--muted);line-height:1.6}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}.btn.full{width:100%;margin-top:10px}.restaurant-head{padding:18px;background:#fff;border-bottom:1px solid var(--line)}.restaurant-title{display:flex;gap:12px;align-items:center}.avatar{width:68px;height:68px;border-radius:22px;background:var(--sand);display:grid;place-items:center;font-size:34px}.menu-item{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}.menu-item .thumb{width:88px;height:88px;flex:0 0 88px;border-radius:15px}.menu-item h3{margin:0 0 5px}.menu-item .actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--cream);cursor:pointer}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:74px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:50}.bottom a{display:grid;place-items:center;font-size:11px;color:var(--muted)}.bottom a.active{color:var(--primary);font-weight:900}.bottom span{font-size:22px;margin-bottom:2px}.list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.total{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}.total div{display:flex;justify-content:space-between;margin:8px 0}.total .grand{font-size:19px;font-weight:900;color:var(--primary);border-top:1px dashed var(--line);padding-top:12px}.form{display:grid;gap:10px}.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;width:100%;outline:none}.back{display:inline-flex;align-items:center;gap:7px;margin:15px 18px 0;color:var(--primary);font-weight:800}.notice{background:#fff4e8;border:1px solid #efd2b2;color:#6d432d;border-radius:16px;padding:13px;line-height:1.7}.status{background:var(--primary);color:#fff;border-radius:20px;padding:18px;text-align:center}.profile{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:25px;padding:22px;margin:18px}.profile .avatar{background:rgba(255,255,255,.2)}@media(min-width:700px){body{background:#eee5dc}.app{background:var(--cream);box-shadow:0 0 50px rgba(0,0,0,.08)}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><a class="back" style="margin:0" href="cart.html">→ السلة</a><div class="logo"><span class="logo-mark">و</span>الدفع</div></div></header>
<section class="section"><h2>بيانات التوصيل</h2><p class="muted">أدخل معلومات استلام الطلب</p>
<form class="form" onsubmit="placeOrder(event)">
<input class="field" id="name" required placeholder="الاسم">
<input class="field" id="phone" required placeholder="رقم الهاتف">
<input class="field" id="address" required placeholder="العنوان / المنطقة">
<select class="field" id="pay"><option>الدفع نقداً</option><option>الدفع إلكترونياً</option></select>
<button class="btn full" type="submit">تأكيد الطلب</button>
</form></section>
<section class="section"><div class="notice">بعد التأكيد راح نعرضلك حالة الطلب مباشرة.</div></section>
<script src="supabase-config.js"></script>
<script>
// Inline fallback: keeps the app working even if supabase-config.js is not loaded by GitHub Pages.
window.WASSELNI_SUPABASE = window.WASSELNI_SUPABASE || Object.freeze({
  url: 'https://ogiflmvzizvupdphxxon.supabase.co',
  key: 'sb_publishable_TJxZmbtpLDu5dI-ygeVEzA_j3YFh--7'
});
window.WASSELNI_DB = window.WASSELNI_DB || {
  async request(path, options = {}) {
    const headers = {
      apikey: window.WASSELNI_SUPABASE.key,
      Authorization: 'Bearer ' + window.WASSELNI_SUPABASE.key,
      Accept: 'application/json',
      'Content-Type': 'application/json',
      ...(options.headers || {})
    };
    const response = await fetch(window.WASSELNI_SUPABASE.url + '/rest/v1/' + String(path).replace(/^\/+/, ''), { ...options, headers });
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    if (!response.ok) {
      const message = data?.message || data?.hint || data?.details || text || ('HTTP ' + response.status);
      throw new Error(message);
    }
    return data;
  }
};
</script>

<script>
async function placeOrder(e){
  e.preventDefault();
  const cart=JSON.parse(localStorage.getItem('wasselniCart')||'[]');
  if(!cart.length){ alert('السلة فارغة'); location.href='restaurants.html'; return; }
  const customerName=document.getElementById('name').value.trim();
  const phoneValue=document.getElementById('phone').value.trim();
  const addressValue=document.getElementById('address').value.trim();
  const paymentValue=document.getElementById('pay').value;
  const subtotal=cart.reduce((sum,x)=>sum+(Number(x.price)||0)*(Number(x.qty)||0),0);
  const delivery=2000;
  const total=subtotal+delivery;
  const orderCode='WS'+Date.now().toString().slice(-8);
  const payload={
    order_code:orderCode,
    customer_name:customerName,
    phone:phoneValue,
    address:addressValue,
    payment_method:paymentValue,
    items:cart,
    total:total,
    status:'جديد'
  };
  const btn=e.submitter;
  if(btn){btn.disabled=true;btn.textContent='جاري إرسال الطلب...';}
  try{
    const rows=await window.WASSELNI_DB.request('orders',{
      method:'POST',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify(payload)
    });
    const saved=Array.isArray(rows)?rows[0]:rows;
    localStorage.setItem('wasselniOrder',JSON.stringify(saved||payload));
    localStorage.removeItem('wasselniCart');
    location.href='orders.html';
  }catch(err){
    console.error(err);
    alert('تعذر إرسال الطلب:\n'+err.message);
    if(btn){btn.disabled=false;btn.textContent='تأكيد الطلب';}
  }
}
</script>
