</style><style>body{background:#fff}.detail-top{background:var(--brand);color:#fff;padding:16px 18px 28px;border-radius:0 0 32px 32px}.detail-wrap{max-width:900px;margin:auto;padding:0 18px 100px}.cover{margin-top:-10px;background:#f1e7d8;border-radius:26px;height:220px;display:grid;place-items:center;font-size:105px;box-shadow:var(--shadow);position:relative}.cover .tag{position:absolute;top:15px;right:15px;background:#fff;color:var(--brand);padding:7px 10px;border-radius:99px;font-size:9px;font-weight:900}.info{padding:20px 4px}.info h1{font-size:28px;margin:0 0 5px}.info p{font-size:11px;color:#888}.meta-row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--soft);border:1px solid var(--line);padding:7px 10px;border-radius:99px;font-size:9px}.menu-tabs{display:flex;gap:8px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}.menu-tabs button{border:0;background:#f7f2ea;border-radius:99px;padding:9px 15px;font-size:10px;font-weight:800;white-space:nowrap}.menu-tabs button.active{background:var(--brand);color:#fff}.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.dish{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.dish-img{height:145px;background:#f5eee4;display:grid;place-items:center;font-size:65px}.dish-body{padding:11px}.dish h3{font-size:13px;margin:0 0 4px}.dish p{font-size:8px;color:#999;line-height:1.7;min-height:27px;margin:0 0 9px}.dish-foot{display:flex;justify-content:space-between;align-items:center}.dish-price{font-size:11px;font-weight:900;color:var(--brand)}.add{border:0;background:var(--dark);color:#fff;width:31px;height:31px;border-radius:11px;font-size:18px}.cart-bar{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);width:min(860px,calc(100% - 28px));background:var(--dark);color:#fff;border-radius:17px;padding:12px 15px;display:flex;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:20}.cart-bar b{margin-right:auto}.cart-bar button{border:0;background:var(--coral);color:#fff;border-radius:11px;padding:9px 13px;font-size:9px;font-weight:900}@media(max-width:600px){.cover{height:190px}.dish-img{height:120px;font-size:55px}}</style></head><body><header class="detail-top"><div class="top-row"><a class="brand" href="restaurants.html"><span class="brand-mark">و</span><span>وصّلني</span></a><a class="back" href="restaurants.html">← المطاعم</a></div></header><main class="detail-wrap"><div id="cover" class="cover"></div><section class="info"><h1 id="name"></h1><p id="desc"></p><div class="meta-row"><span class="pill" id="rating"></span><span class="pill" id="time"></span><span class="pill">توصيل سريع</span></div></section><div class="menu-tabs"><button class="active">الأكثر طلباً</button><button>الوجبات</button><button>المقبلات</button><button>المشروبات</button></div><div id="menu" class="menu-grid"></div></main><div class="cart-bar"><span>السلة</span><b id="cart">0 د.ع</b><button onclick="alert('السلة راح نربطها بالخطوة الجاية')">عرض السلة</button></div><nav class="bottom-nav"><a href="index.html"><span>⌂</span><small>الرئيسية</small></a><a href="index.html#offers"><span>✦</span><small>العروض</small></a><a class="center" href="restaurants.html"><b>و</b><small>اطلب</small></a><a class="active" href="restaurants.html"><span>▤</span><small>المطاعم</small></a><a><span>♙</span><small>حسابي</small></a></nav><script>
const restaurants=[
{name:'كيوي برغر',type:'برغر',time:'20–25 دقيقة',rating:'4.9',price:'12,000',emoji:'🍔',tag:'الأكثر طلباً',desc:'برغر طازج وصوص خاص'},
{name:'نابولي',type:'بيتزا',time:'25–30 دقيقة',rating:'4.8',price:'15,000',emoji:'🍕',tag:'مميز',desc:'بيتزا على الطريقة الإيطالية'},
{name:'دارنا',type:'عراقي',time:'30–35 دقيقة',rating:'4.7',price:'18,000',emoji:'🍲',tag:'عراقي',desc:'أكلات عراقية بطابع عصري'},
{name:'مزاج كافيه',type:'قهوة',time:'15–20 دقيقة',rating:'4.9',price:'6,000',emoji:'☕',tag:'قريب منك',desc:'قهوة وحلويات يومية'},
{name:'دجاجة',type:'برغر',time:'20–25 دقيقة',rating:'4.6',price:'11,000',emoji:'🍗',tag:'جديد',desc:'دجاج مقرمش وتتبيلة خاصة'},
{name:'سويت هاوس',type:'حلويات',time:'20–30 دقيقة',rating:'4.8',price:'8,000',emoji:'🍰',tag:'حلو اليوم',desc:'حلويات طازجة كل يوم'},
{name:'مشاوي بغداد',type:'عراقي',time:'35–40 دقيقة',rating:'4.7',price:'22,000',emoji:'🥩',tag:'عائلي',desc:'مشاوي عراقية على الفحم'},
{name:'كافيه 27',type:'قهوة',time:'18–23 دقيقة',rating:'4.8',price:'7,000',emoji:'🧋',tag:'ترند',desc:'قهوة ومشروبات باردة'}
];
let current='الكل';
function render(type=current,list=restaurants){current=type;const data=type==='الكل'?list:list.filter(r=>r.type===type);document.querySelector('#grid').innerHTML=data.map(r=>`<article class="restaurant" onclick="addCart()"><div class="food-img">${r.emoji}<span>${r.tag}</span></div><div class="restaurant-body"><h3>${r.name}</h3><div class="meta"><span>★ ${r.rating} · ${r.time}</span><span>${r.price}+</span></div><p>${r.desc}</p></div></article>`).join('')||'<div style="grid-column:1/-1;padding:40px;text-align:center">ما لكينا نتائج بهالفئة حالياً.</div>'}
function filter(type){document.querySelector('#restaurants').scrollIntoView({behavior:'smooth'});render(type==='مطاعم'?'الكل':type)}
function searchRestaurants(){const q=document.querySelector('#search').value.trim();if(!q){render('الكل');return}const data=restaurants.filter(r=>(r.name+r.type+r.desc).includes(q));document.querySelector('#restaurants').scrollIntoView({behavior:'smooth'});render('الكل',data)}
function addCart(){const el=document.querySelector('#cartCount');el.textContent=Number(el.textContent)+1}
render();


const items=[['وجبة المطعم الخاصة','🥘','18,000','طبق اليوم المميز مع المقبلات'],['برغر الوصل','🍔','12,000','برغر لحم وصوص خاص وخبز طازج'],['وجبة الدجاج','🍗','14,000','دجاج مقرمش مع بطاطا وصوص'],['بيتزا خاصة','🍕','15,000','عجينة طازة وجبن غني'],['مقبلات مشكلة','🥗','7,000','تشكيلة خفيفة للمشاركة'],['مشروب بارد','🧋','5,000','مشروب منعش حسب اختيارك']];const n=new URLSearchParams(location.search).get('id')||'كيوي برغر';const r=restaurants.find(x=>x.name===n)||restaurants[0];document.getElementById('name').textContent=r.name;document.getElementById('desc').textContent=r.desc;document.getElementById('rating').textContent='★ '+r.rating+' تقييم';document.getElementById('time').textContent='⏱ '+r.time;document.getElementById('cover').innerHTML=r.emoji+'<span class="tag">'+r.tag+'</span>';let total=0;document.getElementById('menu').innerHTML=items.map((x,i)=>`<article class="dish"><div class="dish-img">${x[1]}</div><div class="dish-body"><h3>${x[0]}</h3><p>${x[3]}</p><div class="dish-foot"><span class="dish-price">${x[2]} د.ع</span><button class="add" onclick="add(${i})">+</button></div></div></article>`).join('');function add(i){total+=Number(items[i][2].replace(',',''));document.getElementById('cart').textContent=total.toLocaleString('en-US')+' د.ع';}</script></body></html>
