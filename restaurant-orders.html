<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات المطعم - وصّلني</title><style>body{margin:0;background:#eee5dc;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:1100px;margin:auto;min-height:100vh;background:#fff9ef}.top{padding:18px 22px;background:#fff;border-bottom:1px solid #ead8c4;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:900;color:#8d4f32}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.order{background:#fff;border:1px solid #ead8c4;border-radius:20px;padding:18px;box-shadow:0 8px 25px rgba(86,48,30,.07)}.head{display:flex;justify-content:space-between;gap:10px}.badge{padding:7px 10px;border-radius:99px;background:#f1dfc7;color:#8d4f32;font-size:12px;font-weight:900}.items{background:#fff9ef;border-radius:14px;padding:12px;margin:12px 0;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:12px 14px;background:#8d4f32;color:#fff;font-weight:900;cursor:pointer}.btn.light{background:#fff;color:#8d4f32;border:1px solid #8d4f32}.empty{text-align:center;padding:70px;color:#7d7067}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div class="logo">و وصّلني / لوحة المطعم</div><b>طلبات المطعم</b></header><section class="content"><h1>الطلبات الواردة</h1><p>هنا يوصل الطلب، ومن هنا المطعم يوافق عليه ويعلن أنه جاهز للسائق.</p><div id="cards" class="cards"></div></section></main><script src="wasselni-db.js"></script><script>
const statusText={pending:'بانتظار موافقة المطعم',accepted:'تم قبول الطلب',preparing:'قيد التحضير',ready:'جاهز للسائق',picked_up:'استلمه السائق',delivered:'تم التوصيل'};
function draw(){const list=WasselniOrders.all().filter(o=>!['delivered'].includes(o.status));cards.innerHTML=list.length?list.map(o=>{let action='';if(o.status==='pending')action='<button class="btn" onclick="setStatus(\''+o.id+'\',\'accepted\')">👍 موافقة على الطلب</button>';else if(o.status==='accepted')action='<button class="btn" onclick="setStatus(\''+o.id+'\',\'preparing\')">👨‍🍳 بدء التحضير</button>';else if(o.status==='preparing')action='<button class="btn" onclick="setStatus(\''+o.id+'\',\'ready\')">🛵 جاهز للسائق</button>';else if(o.status==='ready')action='<span class="badge">بانتظار السائق</span>';else if(o.status==='picked_up')action='<span class="badge">السائق استلم الطلب</span>';return '<article class="order"><div class="head"><div><b>#'+o.id+'</b><div>'+o.customer+' · '+o.phone+'</div></div><span class="badge">'+statusText[o.status]+'</span></div><div class="items">'+(o.items||[]).map(x=>'<div>• '+x.name+' × '+(x.qty||1)+'</div>').join('')+'<hr><b>'+Number(o.total||0).toLocaleString('en-US')+' د.ع</b><br>📍 '+o.address+'</div><div class="actions">'+action+'</div></article>'}).join(''):'<div class="empty">ماكو طلبات حالياً</div>'}function setStatus(id,status){WasselniOrders.update(id,{status,restaurantStatus:status});draw()}draw();WasselniOrders.subscribe(draw);
</script></body></html>
