<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المندوب - وصّلني</title><style>
:root{--p:#8d4f32;--p2:#b96f4c;--bg:#fff9ef;--sand:#f1dfc7;--ink:#29231f;--muted:#7d7067;--line:#ead8c4;--g:#54715b;--r:#a54b42}*{box-sizing:border-box}body{margin:0;background:#eee5dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:40px}.top{padding:20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;color:var(--p)}.mark{display:inline-grid;place-items:center;background:var(--p);color:#fff;border-radius:12px;width:40px;height:40px;margin-left:8px}.content{padding:20px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px;border-radius:22px;margin-bottom:18px}.hero h1{margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#fff;opacity:.85}.grid{display:grid;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 25px rgba(86,48,30,.07)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{padding:6px 10px;border-radius:99px;background:var(--sand);color:var(--p);font-weight:800;font-size:12px}.btn{border:0;border-radius:13px;padding:11px 14px;background:var(--p);color:#fff;font-weight:900;cursor:pointer}.btn.green{background:var(--g)}.btn.gray{background:#eee;color:#555}.actions{display:flex;gap:8px;margin-top:13px}.actions .btn{flex:1}.items{font-size:13px;line-height:1.9;margin:10px 0;color:#5e534c}.empty{text-align:center;padding:50px;color:var(--muted)}
</style></head><body><main class="app"><header class="top"><div class="logo"><span class="mark">و</span>وصّلني <small>/ المندوب</small></div><button class="btn gray" onclick="load()">تحديث</button></header><section class="content"><div class="hero"><h1>طلبات جاهزة للاستلام 🛵</h1><div class="muted">اختار الطلب، استلمه من المطعم، وبعدها حدّث حالته إلى «بالطريق» ثم «تم التسليم».</div></div><div id="list" class="grid"></div></section></main><script src="wasselni-db.js"></script><script>
const DRIVER={id:'driver-001',name:'مندوب وصّلني'};const labels={ready:'جاهز للاستلام',picked_up:'تم الاستلام',on_the_way:'بالطريق',delivered:'تم التسليم'};async function load(){const all=await WASSELNI_DB.list();const visible=all.filter(o=>['ready','picked_up','on_the_way'].includes(o.status));document.getElementById('list').innerHTML=visible.length?visible.map(o=>`<article class="card"><div class="row"><strong>#${o.id}</strong><span class="tag">${labels[o.status]||o.status}</span></div><p><b>${o.customer_name||o.name}</b><br>${o.address||''}<br>📞 ${o.phone||''}</p><div class="items">${(o.items||[]).map(i=>`${i.name||i.title||'صنف'} × ${i.qty||1}`).join('، ')}</div><div class="row"><strong>${Number(o.total||0).toLocaleString('ar-IQ')} د.ع</strong><span class="muted">${o.restaurant_name||'المطعم'}</span></div><div class="actions">${o.status==='ready'?`<button class="btn" onclick="take('${o.id}')">استلام الطلب</button>`:''}${o.status==='picked_up'?`<button class="btn" onclick="go('${o.id}')">بدأ التوصيل</button>`:''}${o.status==='on_the_way'?`<button class="btn green" onclick="done('${o.id}')">تم التسليم</button>`:''}</div></article>`).join(''):'<div class="empty">ماكو طلبات جاهزة حالياً.</div>'}async function take(id){await WASSELNI_DB.update(id,{status:'picked_up',driver_id:DRIVER.id,driver_name:DRIVER.name});load()}async function go(id){await WASSELNI_DB.update(id,{status:'on_the_way'});load()}async function done(id){await WASSELNI_DB.update(id,{status:'delivered'});load()}load();</script></body></html>
