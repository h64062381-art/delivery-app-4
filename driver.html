<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات السائق - وصّلني</title><style>body{margin:0;background:#eee5dc;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh;background:#fff9ef}.top{padding:18px 22px;background:#fff;border-bottom:1px solid #ead8c4;display:flex;justify-content:space-between}.logo{font-size:24px;font-weight:900;color:#8d4f32}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #ead8c4;border-radius:20px;padding:18px}.badge{display:inline-block;padding:7px 10px;border-radius:99px;background:#e8efe9;color:#54715b;font-weight:900;font-size:12px}.btn{border:0;background:#8d4f32;color:#fff;padding:12px 14px;border-radius:13px;font-weight:900;cursor:pointer;width:100%;margin-top:10px}.empty{text-align:center;padding:70px;color:#7d7067}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div class="logo">و وصّلني / السائق</div><b>الطلبات الجاهزة</b></header><section class="content"><h1>طلبات جاهزة للاستلام</h1><p>الطلب يظهر هنا فقط بعد أن يضغط المطعم «جاهز للسائق».</p><div id="cards" class="cards"></div></section></main><script src="order-store.js"></script><script>
function draw(){const list=WasselniOrders.all().filter(o=>o.status==='ready'||o.status==='picked_up');cards.innerHTML=list.length?list.map(o=>'<article class="card"><span class="badge">'+(o.status==='ready'?'جاهز للاستلام':'معك الآن')+'</span><h2>#'+o.id+'</h2><p><b>'+o.customer+'</b><br>📞 '+o.phone+'<br>📍 '+o.address+'</p><div style="background:#fff9ef;padding:12px;border-radius:14px">'+(o.items||[]).map(x=>'<div>• '+x.name+' × '+(x.qty||1)+'</div>').join('')+'<hr><b>'+Number(o.total||0).toLocaleString('en-US')+' د.ع</b></div>'+(o.status==='ready'?'<button class="btn" onclick="take(\''+o.id+'\')">🚴 استلام الطلب والتوجه للزبون</button>':'<button class="btn" onclick="deliver(\''+o.id+'\')">✅ تم تسليم الطلب</button>')+'</article>').join(''):'<div class="empty">ماكو طلبات جاهزة حالياً<br><small>الطلب يظهر بعد موافقة المطعم وضغط «جاهز للسائق».</small></div>'}function take(id){WasselniOrders.update(id,{status:'picked_up',driverStatus:'picked_up',driverId:'driver-1'});draw()}function deliver(id){WasselniOrders.update(id,{status:'delivered',driverStatus:'delivered'});draw()}draw();WasselniOrders.subscribe(draw);
</script></body></html>
