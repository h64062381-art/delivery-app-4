<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سائق وصّلني</title>
<style>
:root{--p:#8d4f32;--p2:#b96f4c;--bg:#fff9ef;--sand:#f1dfc7;--ink:#29231f;--muted:#7d7067;--line:#ead8c4;--green:#54715b;--shadow:0 10px 30px rgba(86,48,30,.10)}
*{box-sizing:border-box}body{margin:0;background:#eee5dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:35px}.top{position:sticky;top:0;z-index:10;padding:16px 18px;background:rgba(255,249,239,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:9px;color:var(--p);font-size:24px;font-weight:900}.mark{width:44px;height:44px;border-radius:15px;background:var(--p);color:#fff;display:grid;place-items:center}.driver{background:var(--sand);border-radius:13px;padding:9px 12px;font-weight:800}.hero{margin:18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:25px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:0 0 7px;font-size:27px}.hero p{margin:0;opacity:.9;line-height:1.7}.tools{display:flex;gap:9px;margin:0 18px 14px}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--p);color:#fff;font-weight:800;cursor:pointer}.btn.light{background:#fff;color:var(--p);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.list{display:grid;gap:12px;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font-size:18px;font-weight:900;color:var(--p)}.badge{padding:6px 10px;border-radius:99px;background:#e5efe6;color:var(--green);font-size:12px;font-weight:900}.rows{display:grid;gap:8px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.row:last-child{border-bottom:0}.muted{color:var(--muted);font-size:13px}.total{font-size:19px;font-weight:900;color:var(--p)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.error{margin:18px;padding:15px;border-radius:16px;background:#f8e8e6;color:#9b3f35;border:1px solid #e9c4bf;line-height:1.7}.note{margin:18px;padding:14px;border-radius:16px;background:#fff4e8;border:1px solid #efd2b2;line-height:1.7;color:#6d432d}@media(min-width:700px){.app{box-shadow:0 0 50px rgba(0,0,0,.08)}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo"><span class="mark">و</span>سائق وصّلني</div><div class="driver">🚗 السائق</div></div></header>
<section class="hero"><h1>طلبات التوصيل</h1><p>هنا تظهر الطلبات الجاهزة للتوصيل. استلم الطلب ثم حدّث حالته لحد ما يتم التسليم.</p></section>
<div class="tools"><button class="btn" onclick="loadOrders()">تحديث الطلبات</button><button class="btn light" onclick="location.href='index.html'">الرئيسية</button></div>
<div id="message"></div><section id="list" class="list"></section>
<div class="note">الحالة الحالية: <b>جاهز للتوصيل</b> → <b>قيد التوصيل</b> → <b>تم التسليم</b>.</div>
<script src="supabase-config.js"></script>
<script>
const list=document.getElementById('list'), message=document.getElementById('message');
let orders=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function itemsText(items){return Array.isArray(items)&&items.length?items.map(x=>`${esc(x.name||'صنف')} ×${Number(x.qty||1)}`).join('، '):'بدون تفاصيل أصناف';}
function draw(){
 if(!orders.length){list.innerHTML='<div class="empty"><div style="font-size:48px">🛵</div><h2>ماكو طلبات جاهزة حالياً</h2><p>من يجهز المطعم طلب جديد راح يظهر هنا.</p></div>';return;}
 list.innerHTML=orders.map((o,i)=>{
  const taking=o.status==='جاهز للتوصيل';
  const delivering=o.status==='قيد التوصيل';
  return `<article class="card"><div class="topline"><div class="code">#${esc(o.order_code)}</div><span class="badge">${esc(o.status)}</span></div><div class="rows"><div class="row"><span class="muted">الزبون</span><b>${esc(o.customer_name)}</b></div><div class="row"><span class="muted">الهاتف</span><b dir="ltr">${esc(o.phone)}</b></div><div class="row"><span class="muted">العنوان</span><b>${esc(o.address)}</b></div><div class="row"><span class="muted">الطلب</span><b>${itemsText(o.items)}</b></div><div class="row"><span class="muted">الإجمالي</span><b class="total">${Number(o.total||0).toLocaleString()} د.ع</b></div></div><div class="actions">${taking?`<button class="btn full" onclick="setStatus(${i},'قيد التوصيل')">🚗 استلام الطلب وبدء التوصيل</button>`:''}${delivering?`<button class="btn full" onclick="setStatus(${i},'تم التسليم')">✅ تم تسليم الطلب</button>`:''}</div></article>`;
 }).join('');
}
async function loadOrders(){
 message.innerHTML='';
 try{orders=await window.WASSELNI_DB.request('orders?select=*&status=in.(جاهز%20للتوصيل,قيد%20التوصيل)&order=created_at.asc');draw();}
 catch(err){console.error(err);orders=[];list.innerHTML='';message.innerHTML=`<div class="error">تعذر جلب طلبات التوصيل.<br>${esc(err.message)}</div>`;}
}
async function setStatus(i,status){
 const o=orders[i];if(!o)return;
 try{await window.WASSELNI_DB.request('orders?order_code=eq.'+encodeURIComponent(o.order_code),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status})});
  await loadOrders();
 }catch(err){alert('تعذر تحديث حالة الطلب:\n'+err.message);}
}
loadOrders();setInterval(loadOrders,5000);
</script></main></body></html>
